; =====================================================================
;  Transit Package Logger — PlatformIO project file
;  Board   : MYOSA Mini Kit (ESP32-WROOM-32E based)
;  Framework: Arduino
; =====================================================================
[env:myosa_minikit]
platform = espressif32
board = esp32dev              ; MYOSA uses a plain ESP32-WROOM-32E, esp32dev matches it.
                               ; Change if you have a different board.json for MYOSA.
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ---- Flash / filesystem layout -------------------------------------
; We need room for the app AND a LittleFS partition big enough to hold
; days of CSV event logs. Uses the standard "default" 4MB layout with
; SPIFFS renamed usage as LittleFS (works with the same partition table).
board_build.filesystem = littlefs
board_build.partitions = default.csv

; ---- Libraries -------------------------------------------------------
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
